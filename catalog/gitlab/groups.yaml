  - id: gitlab.groups.create-group
    match: { rest: { method: POST, path: "/api/v4/groups" } }
    class: credential
    when:
      - if: { arg: body.visibility, in: ["public", "internal"] }
        class: access
      - if: { arg: query.visibility, in: ["public", "internal"] }
        class: access
      - if: { arg: body.require_two_factor_authentication, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.require_two_factor_authentication, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
    response:
      redact: ["**.runners_token"]
      class: write
    card: "Create GitLab group {body.name}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/lib/api/entities
    notes: >-
      Maintainers and owners get the legacy runner registration token (runners_token) in the project
      or group, which registers a runner that then receives the project's jobs and their CI/CD
      variables. Under opfence run the proxy redacts it; anywhere else the call stays credential,
      for its response. A public or internal group, or one that does not require two-factor
      authentication, is access.
    tests:
      - fixture: fixtures/groups-create-group.http
        expect: credential
        response: fixtures/groups-create-group-response.json
      - fixture: fixtures/groups-create-group-visibility.http
        expect: access

  - id: gitlab.groups.update-group-attributes
    match: { rest: { method: PUT, path: "/api/v4/groups/{id}" } }
