    match: { rest: { method: PUT, path: "/api/v4/integrations/jira_forge/installation" } }
    class: access
    card: "Update the GitLab for Jira (Forge) installation instance URL"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
