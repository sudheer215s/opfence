    match: { rest: { method: POST, path: "/api/v4/projects/import/authorize" } }
    class: read
    card: "Workhorse authorize the project import upload"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Workhorse's pre-check before an upload; nothing is stored.
    tests:
      - fixture: fixtures/project-import-workhorse-authorize-project-import-upload.http
        expect: read

