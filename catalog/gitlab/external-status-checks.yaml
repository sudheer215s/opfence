# GitLab REST API (gitlab.com/api/v4): External status checks.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.external-status-checks.create-external-status-check-service
    match: { rest: { method: POST, path: "/api/v4/projects/{id}/external_status_checks" } }
    class: access
    resource: { arg: id, kind: project }
    card: "Create external status check service in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      External status checks decide whether a merge request can merge; reporting a check as passed
      bypasses it.
    tests:
      - fixture: fixtures/external-status-checks-create-external-status-check-service.http
        expect: access
        resource: "acme/shop"

