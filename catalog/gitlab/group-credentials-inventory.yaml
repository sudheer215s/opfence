    class: credential
    resource: { arg: id, kind: group }
    card: "Rotate a personal access token for an enterprise user {pat_id} in group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Returns the new token.
    tests:
      - fixture: fixtures/group-credentials-inventory-rotate-personal-access-token-for-enterprise-user.http
        expect: credential
        resource: "acme"

