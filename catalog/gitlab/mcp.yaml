  - id: gitlab.mcp.accept-merge-request
    match: { mcp: { tool: accept_merge_request } }
    class: write
    when:
      - if: { arg: should_remove_source_branch, in: ["true", "1", "t", "y", "yes", "on"] }
        class: delete
    resource: { arg: project_id, kind: project }
    card: "Merge merge request !{merge_request_iid} of project {project_id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/app/services/mcp/tools/manager.rb
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/app/services/mcp/tools/merge_requests/accept_merge_request_service.rb
    notes: >-
      Merging is a write, as GitHub's merge_pull_request is; removing the source branch is delete.
    tests:
      - fixture: fixtures/mcp-accept-merge-request.http
        expect: write
        resource: "acme/shop"
      - fixture: fixtures/mcp-accept-merge-request-remove-source-branch.http
        expect: delete
        resource: "acme/shop"

