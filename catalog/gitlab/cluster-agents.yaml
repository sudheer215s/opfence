    tests:
      - fixture: fixtures/cluster-agents-create-agent.http
        expect: write
        resource: "acme/shop"

  - id: gitlab.cluster-agents.delete-agent
    match: { rest: { method: DELETE, path: "/api/v4/projects/{id}/cluster_agents/{agent_id}" } }
    class: delete
    resource: { arg: id, kind: project }
    card: "Delete an agent {agent_id} in project {id}"
