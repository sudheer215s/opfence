# GitLab REST API (gitlab.com/api/v4): CI variables.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.ci-variables.list-all-group-variables
    match: { rest: { method: GET, path: "/api/v4/groups/{id}/variables" } }
    class: credential
    resource: { arg: id, kind: group }
    card: "Read group {id}'s CI/CD variables with their values"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Returns the group's CI/CD variables with their values.
    tests:
      - fixture: fixtures/ci-variables-list-all-group-variables.http
        expect: credential
        resource: "acme"

  - id: gitlab.ci-variables.create-group-variable
    match: { rest: { method: POST, path: "/api/v4/groups/{id}/variables" } }
    class: write
    when:
      - if: { arg: body.masked, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: query.masked, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: body.masked_and_hidden, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: query.masked_and_hidden, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
    resource: { arg: id, kind: group }
    card: "Set CI/CD variable {body.key} in group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Plain variables are settings; masked and hidden ones are secrets (conditions below). A masked
      or hidden variable is a secret, so setting one is credential.
    tests:
      - fixture: fixtures/ci-variables-create-group-variable.http
        expect: write
        resource: "acme"
      - fixture: fixtures/ci-variables-create-group-variable-masked.http
        expect: credential
        resource: "acme"
      - fixture: fixtures/ci-variables-create-group-variable-masked-and-hidden.http
        expect: credential
        resource: "acme"

  - id: gitlab.ci-variables.retrieve-details-of-group-variable
    match: { rest: { method: GET, path: "/api/v4/groups/{id}/variables/{key}" } }
    class: credential
    resource: { arg: id, kind: group }
    card: "Read CI/CD variable {key} of group {id}"
    status: verified
    verified: 2026-10-28
