    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/lib/api/entities
    notes: >-
      Maintainers and owners get the legacy runner registration token (runners_token) in the project
      or group, which registers a runner that then receives the project's jobs and their CI/CD
      variables. Under opfence run the proxy redacts it; anywhere else the call stays credential,
      for its response. A public or internal group, and any change to two-factor enforcement,
      sharing and forking locks, IP and email domain restrictions, default branch protection, merge
      safeguards, LDAP links or token expiry enforcement, is access; compute minute limits are
      money.
    tests:
