    match: { rest: { method: POST, path: "/api/v4/integrations/slack/options" } }
    class: read
    card: "Get Slack interactive component options"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    tests:
      - fixture: fixtures/integrations-get-slack-interactive-component-options.http
        expect: read

