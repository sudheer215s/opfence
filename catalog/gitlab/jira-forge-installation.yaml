  - id: gitlab.jira-forge-installation.destroy-gitlab-for-jira-installation-on-app-uninstall
    match: { rest: { method: DELETE, path: "/api/v4/integrations/jira_forge/installation" } }
    class: delete
    card: "Destroy the GitLab for Jira (Forge) installation on app uninstall"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
