# GitLab REST API (gitlab.com/api/v4): Wikis.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.wikis.create-wiki-page-for-group
    match: { rest: { method: POST, path: "/api/v4/groups/{id}/wikis" } }
    class: write
    resource: { arg: id, kind: group }
    card: "Create a wiki page for group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    tests:
      - fixture: fixtures/wikis-create-wiki-page-for-group.http
        expect: write
        resource: "acme"

  - id: gitlab.wikis.update-wiki-page-for-group
