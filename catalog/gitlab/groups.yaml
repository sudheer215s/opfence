      - if: { arg: body.share_with_group_lock, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.share_with_group_lock, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.membership_lock, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.membership_lock, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.prevent_sharing_groups_outside_hierarchy, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.prevent_sharing_groups_outside_hierarchy, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.prevent_forking_outside_group, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.prevent_forking_outside_group, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.ip_restriction_ranges, present: true }
        class: access
      - if: { arg: query.ip_restriction_ranges, present: true }
        class: access
      - if: { arg: body.allowed_email_domains_list, present: true }
        class: access
      - if: { arg: query.allowed_email_domains_list, present: true }
        class: access
      - if: { arg: body.default_branch_protection, present: true }
        class: access
      - if: { arg: query.default_branch_protection, present: true }
        class: access
      - if: { arg: body.default_branch_protection_defaults, present: true }
        class: access
      - if: { arg: query.default_branch_protection_defaults, present: true }
        class: access
      - if: { arg: body.enabled_git_access_protocol, present: true }
        class: access
      - if: { arg: query.enabled_git_access_protocol, present: true }
        class: access
      - if: { arg: body.request_access_enabled, in: ["true", "1", "t", "y", "yes", "on"] }
        class: access
      - if: { arg: query.request_access_enabled, in: ["true", "1", "t", "y", "yes", "on"] }
        class: access
      - if: { arg: body.only_allow_merge_if_pipeline_succeeds, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.only_allow_merge_if_pipeline_succeeds, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.allow_merge_on_skipped_pipeline, in: ["true", "1", "t", "y", "yes", "on"] }
        class: access
      - if: { arg: query.allow_merge_on_skipped_pipeline, in: ["true", "1", "t", "y", "yes", "on"] }
        class: access
      - if: { arg: body.require_sha_for_merge, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.require_sha_for_merge, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.ldap_cn, present: true }
        class: access
      - if: { arg: query.ldap_cn, present: true }
        class: access
      - if: { arg: body.ldap_access, present: true }
        class: access
      - if: { arg: query.ldap_access, present: true }
        class: access
      - if: { arg: body.step_up_auth_required_oauth_provider, present: true }
        class: access
      - if: { arg: query.step_up_auth_required_oauth_provider, present: true }
        class: access
      - if: { arg: body.service_access_tokens_expiration_enforced, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.service_access_tokens_expiration_enforced, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.auto_ban_user_on_excessive_projects_download, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.auto_ban_user_on_excessive_projects_download, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: body.unique_project_download_limit, present: true }
        class: access
      - if: { arg: query.unique_project_download_limit, present: true }
        class: access
      - if: { arg: body.shared_runners_minutes_limit, present: true }
        class: money
      - if: { arg: query.shared_runners_minutes_limit, present: true }
        class: money
      - if: { arg: body.extra_shared_runners_minutes_limit, present: true }
        class: money
      - if: { arg: query.extra_shared_runners_minutes_limit, present: true }
        class: money
    response:
