    resource: { arg: id, kind: project }
    card: "Delete a project package {package_id} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      A package can be published again from its source.
    tests:
      - fixture: fixtures/packages-delete-project-package.http
        expect: delete
        resource: "acme/shop"

