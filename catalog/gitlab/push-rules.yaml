# GitLab REST API (gitlab.com/api/v4): Push rules.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.push-rules.add-push-rules-to-group
    match: { rest: { method: POST, path: "/api/v4/groups/{id}/push_rule" } }
    class: access
    resource: { arg: id, kind: group }
    card: "Add push rules to group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Push rules reject commits by author, message, file or secret; removing one lets them through.
    tests:
      - fixture: fixtures/push-rules-add-push-rules-to-group.http
        expect: access
        resource: "acme"

