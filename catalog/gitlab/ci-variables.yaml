  - id: gitlab.ci-variables.update-group-variable
    match: { rest: { method: PUT, path: "/api/v4/groups/{id}/variables/{key}" } }
    class: write
    when:
      - if: { arg: body.masked, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: query.masked, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: body.masked_and_hidden, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: query.masked_and_hidden, in: ["true", "1", "t", "y", "yes", "on"] }
        class: credential
      - if: { arg: body.protected, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
      - if: { arg: query.protected, in: ["false", "0", "f", "n", "no", "off"] }
        class: access
    resource: { arg: id, kind: group }
    card: "Change CI/CD variable {key} in group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Plain variables are settings; masked and hidden ones are secrets (conditions below). A masked
      or hidden variable is a secret, so setting one is credential; making one unprotected sends it
      to pipelines on every branch, which is access.
    tests:
      - fixture: fixtures/ci-variables-update-group-variable.http
        expect: write
        resource: "acme"
      - fixture: fixtures/ci-variables-update-group-variable-masked.http
        expect: credential
        resource: "acme"
      - fixture: fixtures/ci-variables-update-group-variable-masked-and-hidden.http
        expect: credential
        resource: "acme"
      - fixture: fixtures/ci-variables-update-group-variable-protected.http
        expect: access
        resource: "acme"

