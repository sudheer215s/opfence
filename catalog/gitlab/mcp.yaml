  - id: gitlab.mcp.add-commit
    match: { mcp: { tool: add_commit } }
    class: write
    when:
      - if: { arg: actions.action, equals: "delete" }
        class: delete
    resource: { arg: project_id, kind: project }
    card: "Commit to branch {branch} of project {project_id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/app/services/mcp/tools/manager.rb
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/app/services/mcp/tools/repositories/add_commit_service.rb
    notes: >-
      Committing is a write, as GitHub's push_files is; a delete action removes a file, which is
      delete, as GitHub's delete_file is (the file stays in the history).
    tests:
      - fixture: fixtures/mcp-add-commit.http
        expect: write
        resource: "acme/shop"
      - fixture: fixtures/mcp-add-commit-delete-file.http
        expect: delete
        resource: "acme/shop"

