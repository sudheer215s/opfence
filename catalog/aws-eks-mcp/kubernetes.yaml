# Amazon EKS MCP server (awslabs.eks-mcp-server): Kubernetes resources
operations:
  - id: aws-eks-mcp.k8s-resource.manage
    match: { mcp: { tool: manage_k8s_resource } }
    class: irreversible
    classify:
      provider: kubernetes
      kubernetes:
        action_arg: operation
        actions: { read: get, create: create, replace: replace, patch: patch, delete: delete }
        api_version: api_version
        kind: kind
        name: name
        namespace: namespace
        object: body
        patch: body
        context: cluster_name
    resource: { arg: name, kind: k8s-resource }
    card: "{operation} {kind} {name} in namespace {namespace} of EKS cluster {cluster_name}"
    status: verified
    verified: 2026-10-30
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_apis.py
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/models.py
    notes: >-
      One tool for create, replace, patch, delete and read of any kind, decided since stage 31b
      as the API request it makes (catalog/kubernetes), with the body completed by the kind,
      apiVersion, name and namespace the call gives: deleting a Deployment is delete, deleting a
      Namespace or PersistentVolumeClaim irreversible, reading or setting a Secret credential, a
      role binding access, a privileged pod spec access and a LoadBalancer Service access and
      money. A custom resource's kind, and any other operation value (the server rejects it),
      keep this rule's class. The cluster name stands for the cluster in environments.
    tests:
      - fixture: fixtures/manage-k8s-resource-read.json
        expect: read
        resource: shop-api
      - fixture: fixtures/manage-k8s-resource-create.json
        expect: write
        resource: shop-api
      - fixture: fixtures/manage-k8s-resource-delete.json
        expect: irreversible
        resource: shop-data
      - fixture: fixtures/manage-k8s-resource-delete-deployment.json
        expect: delete
        resource: shop-api
      - fixture: fixtures/manage-k8s-resource-secret.json
        expect: credential
        resource: shop-db-credentials
      - fixture: fixtures/manage-k8s-resource-rbac.json
        expect: access
        resource: agent-admin
      - fixture: fixtures/manage-k8s-resource-loadbalancer.json
        expect: money
        resource: shop-api
      - fixture: fixtures/manage-k8s-resource-privileged.json
        expect: access
        resource: shop-api
      - fixture: fixtures/manage-k8s-resource-custom.json
        expect: irreversible
        resource: shop-api

  - id: aws-eks-mcp.k8s-resource.apply-yaml
    match: { mcp: { tool: apply_yaml } }
    class: credential
    resource: { arg: cluster_name, kind: cluster }
    card: "Apply the manifests in {yaml_path} to namespace {namespace} of EKS cluster {cluster_name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_apis.py
    notes: >-
      Creates (and with force, the default, updates) every object in a local YAML file Opfence
      cannot read. Such files routinely hold Secrets, RBAC bindings and LoadBalancer Services, so
      the call gets the strictest class those reach: setting a secret is credential. It never
      deletes objects.
    tests:
      - fixture: fixtures/apply-yaml.json
        expect: credential
        resource: shop-prod

  - id: aws-eks-mcp.k8s-resource.list
    match: { mcp: { tool: list_k8s_resources } }
    class: read
    when:
      - if: { arg: kind, matches: "(?i)^secrets?$" }
        class: credential
    resource: { arg: cluster_name, kind: cluster }
    card: "List {kind} objects in namespace {namespace} of EKS cluster {cluster_name}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
    notes: >-
      Returns name, namespace, labels and annotations of each object. A Secret's annotations
      include kubectl.kubernetes.io/last-applied-configuration, which holds the Secret's data
      when it was created with kubectl apply, and this tool does not check
      --allow-sensitive-data-access, so listing Secrets is credential.
    tests:
      - fixture: fixtures/list-k8s-resources.json
        expect: read
        resource: shop-prod
      - fixture: fixtures/list-k8s-resources-secrets.json
        expect: credential
        resource: shop-prod

  - id: aws-eks-mcp.k8s-resource.manifest
    match: { mcp: { tool: generate_app_manifest } }
    class: write
    resource: { arg: app_name, kind: app }
    card: "Write Kubernetes manifests for {app_name} to {output_dir}"
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
    notes: >-
      Writes a Deployment and Service manifest into output_dir on the user's machine; applying
      them is a separate apply_yaml call.
    tests:
      - fixture: fixtures/generate-app-manifest.json
        expect: write
        resource: shop-api

  - id: aws-eks-mcp.pod.logs
    match: { mcp: { tool: get_pod_logs } }
    class: read
    resource: { arg: pod_name, kind: pod }
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
    notes: >-
      Needs --allow-sensitive-data-access. Logs are read, as elsewhere in the catalog.
    tests:
      - fixture: fixtures/get-pod-logs.json
        expect: read
        resource: shop-api-7d9f8b6c4-x2k5q

  - id: aws-eks-mcp.event.list
    match: { mcp: { tool: get_k8s_events } }
    class: read
    resource: { arg: name, kind: k8s-resource }
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
    tests:
      - fixture: fixtures/get-k8s-events.json
        expect: read
        resource: shop-api

  - id: aws-eks-mcp.api-version.list
    match: { mcp: { tool: list_api_versions } }
    class: read
    status: verified
    verified: 2026-10-19
    sources:
      - https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/awslabs/eks_mcp_server/k8s_handler.py
    tests:
      - fixture: fixtures/list-api-versions.json
        expect: read
