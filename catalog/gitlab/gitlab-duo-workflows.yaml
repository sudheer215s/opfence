  - id: gitlab.gitlab-duo-workflows.create-flow
    match: { rest: { method: POST, path: "/api/v4/ai/duo_workflows/workflows" } }
    class: write
    when:
      - if: { arg: body.start_workflow, in: ["true", "1", "t", "y", "yes", "on"] }
        class: irreversible
      - if: { arg: query.start_workflow, in: ["true", "1", "t", "y", "yes", "on"] }
        class: irreversible
    card: "Create a GitLab Duo flow with goal {body.goal}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Creating a flow is a write; starting it is irreversible (condition below). With start_workflow
      the flow starts at once, handing its goal to an agent, which is irreversible.
    tests:
      - fixture: fixtures/gitlab-duo-workflows-create-flow.http
        expect: write
      - fixture: fixtures/gitlab-duo-workflows-create-flow-start-workflow.http
        expect: irreversible

