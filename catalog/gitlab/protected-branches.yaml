# GitLab REST API (gitlab.com/api/v4): Protected branches.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.protected-branches.protect-repository-branch
    match: { rest: { method: POST, path: "/api/v4/groups/{id}/protected_branches" } }
    class: access
    resource: { arg: id, kind: group }
    card: "Protect a repository branch in group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Branch protection decides who can push and merge; GitHub's is access too.
    tests:
      - fixture: fixtures/protected-branches-protect-repository-branch.http
        expect: access
        resource: "acme"

  - id: gitlab.protected-branches.group-update-protected-branch
