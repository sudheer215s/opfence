    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Tag protection decides who can create and move release tags.
    tests:
      - fixture: fixtures/protected-tags-unprotect-repository-tags.http
