# GitLab REST API (gitlab.com/api/v4): Service accounts.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.service-accounts.create-instance-service-account
    match: { rest: { method: POST, path: "/api/v4/service_accounts" } }
    class: access
    card: "Create an instance service account"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Service accounts are identities with their own tokens.
    tests:
      - fixture: fixtures/service-accounts-create-instance-service-account.http
        expect: access

  - id: gitlab.service-accounts.update-instance-service-account
    match: { rest: { method: PATCH, path: "/api/v4/service_accounts/{user_id}" } }
