provider: kubernetes-mcp
title: Kubernetes MCP servers
docs: https://github.com/containers/kubernetes-mcp-server
# The two most used Kubernetes MCP servers, whose tool names do not overlap:
# containers/kubernetes-mcp-server (npm and PyPI kubernetes-mcp-server, a Go
# binary), read at commit 7797d39 (2026-10-29), with its default core, config
# and helm toolsets; and Flux159/mcp-server-kubernetes (npm
# mcp-server-kubernetes), read at 4.2.1 (2026-10-26), which runs kubectl and
# helm. Both run locally and call each cluster's API with the user's
# kubeconfig, so the agent hook sees the tool calls.
# Tools that act on Kubernetes objects are decided by the API requests they
# make, against catalog/kubernetes's rules (classify.kubernetes), so deleting
# a Deployment and deleting a namespace get different classes. The cluster
# is the call's context argument when it has one, and namespaces the call
# leaves out are the kubeconfig's ("@kubeconfig"); environments map them in
# the kubernetes provider: kubernetes: { namespace: [...], cluster: [...] }.
# Other toolsets of kubernetes-mcp-server (kiali, kubevirt, tekton, kcp,
# metrics, logs, traces, netobserv, otelcol) have no rules: their tools ask.
# No detect or auth block: the kubeconfig belongs to the clusters.
# Fixtures are .json tool calls (tool + arguments). Generated by
# tools/catalog-gen/kubemcpgen.py.
mcp:
  names: [kubernetes, k8s, kubernetes-mcp-server, mcp-server-kubernetes]
  package: "kubernetes-mcp-server, mcp-server-kubernetes"
