    match: { rest: { method: POST, path: "/api/v4/projects/{id}/trigger/pipeline" } }
    class: write
    resource: { arg: id, kind: project }
    card: "Trigger a pipeline with a token in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Runs a pipeline with a trigger token, as creating one does.
    tests:
      - fixture: fixtures/ci-triggers-project-trigger-pipeline-with-token-trigger-pipeline.http
        expect: write
        resource: "acme/shop"

