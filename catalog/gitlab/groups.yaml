        class: irreversible
    resource: { arg: id, kind: group }
    card: "Delete GitLab group {id} with its subgroups and projects"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Marks the group for deletion; it can be restored until then. permanently_remove deletes it at
      once (condition below).
    tests:
      - fixture: fixtures/groups-schedule-group-for-deletion.http
        expect: delete
        resource: "acme"
      - fixture: fixtures/groups-schedule-group-for-deletion-permanently-remove.http
        expect: irreversible
        resource: "acme"

