# GitLab REST API (gitlab.com/api/v4): Access tokens.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.access-tokens.create-impersonation-token
    match: { rest: { method: POST, path: "/api/v4/users/{user_id}/impersonation_tokens" } }
    class: credential
    resource: { arg: user_id, kind: user }
    card: "Create an impersonation token of user {user_id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Returns the new token.
    tests:
      - fixture: fixtures/access-tokens-create-impersonation-token.http
        expect: credential
        resource: "42"

  - id: gitlab.access-tokens.revoke-impersonation-token
    match: { rest: { method: DELETE, path: "/api/v4/users/{user_id}/impersonation_tokens/{impersonation_token_id}" } }
    class: access
    resource: { arg: user_id, kind: user }
    card: "Revoke an impersonation token {impersonation_token_id} of user {user_id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Apps and scripts that use the token stop working.
    tests:
      - fixture: fixtures/access-tokens-revoke-impersonation-token.http
        expect: access
        resource: "42"

