  - id: gitlab.environments.delete-environment
    match: { rest: { method: DELETE, path: "/api/v4/projects/{id}/environments/{environment_id}" } }
    class: delete
    resource: { arg: id, kind: project }
    card: "Delete environment {environment_id} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
