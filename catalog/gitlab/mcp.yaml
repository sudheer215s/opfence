# GitLab's MCP server (POST gitlab.com/api/v4/mcp, built into GitLab): a rule for every tool
# Mcp::Tools::Manager registers, with their aliases. Written by gitlabmcp.py from GitLab's source.
operations:
  - id: gitlab.mcp.get-artifact-file
    match: { mcp: { tool: get_artifact_file } }
    class: read
    resource: { arg: project_id, kind: project }
    card: "Read {artifact_path} from job {job_id}'s artifacts in project {project_id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/app/services/mcp/tools/manager.rb
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/app/services/mcp/tools/jobs/get_artifact_file_service.rb
    notes: >-
      Artifacts are read as GitHub's are; CI/CD masks variables in job output, not in files a job
      writes.
    tests:
      - fixture: fixtures/mcp-get-artifact-file.http
        expect: read
        resource: "acme/shop"

