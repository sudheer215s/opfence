    notes: >-
      The agent's configuration lives in the repository; it can be registered again.
    tests:
      - fixture: fixtures/cluster-agents-delete-agent.http
        expect: delete
        resource: "acme/shop"

  - id: gitlab.cluster-agents.create-agent-token
    match: { rest: { method: POST, path: "/api/v4/projects/{id}/cluster_agents/{agent_id}/tokens" } }
    class: credential
    resource: { arg: id, kind: project }
    card: "Create an agent token {agent_id} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Returns the agent token.
    tests:
      - fixture: fixtures/cluster-agents-create-agent-token.http
        expect: credential
        resource: "acme/shop"

  - id: gitlab.cluster-agents.revoke-agent-token
    match: { rest: { method: DELETE, path: "/api/v4/projects/{id}/cluster_agents/{agent_id}/tokens/{token_id}" } }
    class: access
    resource: { arg: id, kind: project }
    card: "Revoke an agent token of agent {agent_id} {token_id} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
