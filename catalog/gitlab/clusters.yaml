# GitLab REST API (gitlab.com/api/v4): Clusters.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.clusters.update-cluster-in-project
    match: { rest: { method: PUT, path: "/api/v4/projects/{id}/clusters/{cluster_id}" } }
    class: access
    resource: { arg: id, kind: project }
    card: "Update a cluster in project {id} {cluster_id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Gives GitLab, and the pipelines that deploy to it, a service token for the Kubernetes cluster.
    tests:
      - fixture: fixtures/clusters-update-cluster-in-project.http
        expect: access
        resource: "acme/shop"

