# Railway GraphQL API: subscriptions, which the CLI follows over a WebSocket
# (railway logs, up, restart). All stream logs or status. A subscription
# that selects a secret field (an environment patch's patch) is also
# credential, by defaults.graphql_secret_fields.
operations:

  - id: railway.subscription.build-logs
    match: { graphql: { type: subscription, field: buildLogs } }
    class: read
    resource: { arg: deploymentId, kind: deployment }
    card: "Follow build logs of Railway deployment {deploymentId}"
    status: verified
    verified: 2026-10-24
    sources:
      - https://github.com/railwayapp/cli/blob/master/src/gql/schema.json
      - https://github.com/railwayapp/cli/blob/master/src/subscription.rs
    tests:
      - fixture: fixtures/subscription-build-logs.ws
        expect: read
        resource: "d0f5c6e2-1b7a-4c1e-9a3e-5f2b8c7d6e41"

  - id: railway.subscription.deployment
