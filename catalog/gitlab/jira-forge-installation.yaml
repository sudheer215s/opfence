    class: credential
    card: "Register the GitLab for Jira (Forge) system token for direct dev-info sync"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Registers a token GitLab uses to call Jira.
    tests:
      - fixture: fixtures/jira-forge-installation-register-gitlab-for-jira-system-token-for-direct-dev-info-sync.http
