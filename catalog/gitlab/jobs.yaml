    match: { rest: { method: POST, path: "/api/v4/jobs/request" } }
    class: credential
    card: "Request a job"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      A runner picking up a job receives its CI/CD variables, secrets included.
    tests:
      - fixture: fixtures/jobs-request-job.http
        expect: credential

