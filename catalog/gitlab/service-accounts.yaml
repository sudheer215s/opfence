    match: { rest: { method: POST, path: "/api/v4/projects/{id}/service_accounts" } }
    class: access
    resource: { arg: id, kind: project }
    card: "Create a project service account in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Service accounts are identities with their own tokens.
    tests:
      - fixture: fixtures/service-accounts-create-project-service-account.http
        expect: access
        resource: "acme/shop"

  - id: gitlab.service-accounts.delete-project-service-account
    match: { rest: { method: DELETE, path: "/api/v4/projects/{id}/service_accounts/{user_id}" } }
    class: access
    when:
      - if: { arg: body.hard_delete, in: ["true", "1", "t", "y", "yes", "on"] }
        class: irreversible
      - if: { arg: query.hard_delete, in: ["true", "1", "t", "y", "yes", "on"] }
        class: irreversible
    resource: { arg: id, kind: project }
    card: "Delete a project service account {user_id} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Service accounts are identities with their own tokens. hard_delete also deletes the account's
      contributions.
    tests:
      - fixture: fixtures/service-accounts-delete-project-service-account.http
        expect: access
        resource: "acme/shop"
      - fixture: fixtures/service-accounts-delete-project-service-account-hard-delete.http
        expect: irreversible
        resource: "acme/shop"

