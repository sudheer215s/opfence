operations:
  - id: gitlab.provider-identities.update-extern-uid-field-for-saml-identity
    match: { rest: { method: PATCH, path: "/api/v4/groups/{id}/saml/{uid}" } }
    class: access
    resource: { arg: id, kind: group }
    card: "Update `extern_uid` field for a SAML identity {uid} in group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      SAML and SCIM identities decide who signs in as which user.
    tests:
      - fixture: fixtures/provider-identities-update-extern-uid-field-for-saml-identity.http
        expect: access
        resource: "acme"

