# GitLab REST API (gitlab.com/api/v4): Group credentials inventory.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.group-credentials-inventory.revoke-personal-access-token-for-enterprise-user
    match: { rest: { method: DELETE, path: "/api/v4/groups/{id}/manage/personal_access_tokens/{pat_id}" } }
    class: access
    resource: { arg: id, kind: group }
    card: "Revoke a personal access token for an enterprise user {pat_id} in group {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Revoking a credential stops whatever uses it.
    tests:
      - fixture: fixtures/group-credentials-inventory-revoke-personal-access-token-for-enterprise-user.http
        expect: access
        resource: "acme"

  - id: gitlab.group-credentials-inventory.rotate-personal-access-token-for-enterprise-user
