  - id: gitlab.project-import.export-project
    match: { rest: { method: POST, path: "/api/v4/projects/{id}/export" } }
    class: write
    when:
      - if: { arg: body.upload, present: true }
        class: access
      - if: { arg: query.upload, present: true }
        class: access
    resource: { arg: id, kind: project }
    card: "Export project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      With upload, the export is sent to the URL given, which is access.
    tests:
      - fixture: fixtures/project-import-export-project.http
        expect: write
        resource: "acme/shop"
      - fixture: fixtures/project-import-export-project-upload.http
        expect: access
        resource: "acme/shop"

