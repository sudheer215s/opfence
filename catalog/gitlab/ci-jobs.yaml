# GitLab REST API (gitlab.com/api/v4): CI jobs.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.ci-jobs.cancel-job
    match: { rest: { method: POST, path: "/api/v4/projects/{id}/jobs/{job_id}/cancel" } }
    class: write
    resource: { arg: id, kind: project }
    card: "Cancel job {job_id} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    tests:
      - fixture: fixtures/ci-jobs-cancel-job.http
        expect: write
        resource: "acme/shop"

