# GitLab REST API (gitlab.com/api/v4): Instance.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.instance.retrieve-application-settings
    match: { rest: { method: GET, path: "/api/v4/application/settings" } }
    class: credential
    card: "Read the instance's settings with their secrets"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Returns the instance's settings, among them the Elasticsearch password and AWS secret key, the
      secret detection service's tokens and the Cube API key.
    tests:
      - fixture: fixtures/instance-retrieve-application-settings.http
        expect: credential

