# GitLab REST API (gitlab.com/api/v4): Pipelines.
# Generated from GitLab's OpenAPI description (see provider.yaml); classes reviewed by hand.
operations:
  - id: gitlab.pipelines.create-pipeline
    match: { rest: { method: POST, path: "/api/v4/projects/{id}/pipeline" } }
    class: write
    resource: { arg: id, kind: project }
    card: "Run a pipeline on {body.ref} in project {id}"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    tests:
      - fixture: fixtures/pipelines-create-pipeline.http
        expect: write
        resource: "acme/shop"
      - fixture: fixtures/pipelines-create-pipeline-format-suffix.http
        expect: write
        resource: "acme/shop"

  - id: gitlab.pipelines.delete-pipeline
    match: { rest: { method: DELETE, path: "/api/v4/projects/{id}/pipelines/{pipeline_id}" } }
    class: delete
    resource: { arg: id, kind: project }
    card: "Delete pipeline {pipeline_id} of project {id} with its logs and artifacts"
    status: verified
    verified: 2026-10-28
    sources:
      - https://gitlab.com/gitlab-org/gitlab/-/blob/4addde3db6991438aa04abeb14368a466eb046c0/doc/api/openapi/openapi_v3.yaml
    notes: >-
      Deletes the pipeline with its jobs' logs and artifacts; the commit can be run again, as for
      GitHub's workflow runs.
    tests:
      - fixture: fixtures/pipelines-delete-pipeline.http
        expect: delete
        resource: "acme/shop"

